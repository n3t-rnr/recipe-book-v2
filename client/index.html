<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFE6DD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#231F20" media="(prefers-color-scheme: dark)" />
    <title>Rezepte</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Theme before first paint (NF-14). The server hashes this exact text for the CSP; do not reformat it. -->
    <script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
